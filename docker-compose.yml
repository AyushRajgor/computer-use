# Gemini Computer Use with Docker Compose.
#
# One-off task (live view at http://localhost:6080):
#   docker compose run --rm --service-ports agent --query "Find the weather in Paris"
#   docker compose run --rm --service-ports agent --env browserbase --query "..."
#   docker compose run --rm --service-ports agent --env desktop --query "Open the terminal and run uname -a"
#
# Long-running desktop you can watch and send tasks to:
#   docker compose up -d desktop
#   docker compose exec desktop python main.py --env desktop --query "..."
#
# Secrets come from .env (copy .env.example). Ports are bound to localhost only.

x-computer-use: &computer-use
  image: gemini-computer-use:latest
  env_file:
    - path: .env
      required: false
  environment:
    SAFETY_CONFIRMATION: ${SAFETY_CONFIRMATION:-ask}
  shm_size: "2gb"
  stdin_open: true
  tty: true
  volumes:
    - ./runs:/app/runs

services:
  agent:
    <<: *computer-use
    build:
      context: .
      args:
        WITH_BROWSER_USE: ${WITH_BROWSER_USE:-false}
    ports:
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080"

  desktop:
    <<: *computer-use
    command: ["serve"]
    environment:
      COMPUTER_USE_ENV: desktop
      DESKTOP_STARTUP_APPS: ${DESKTOP_STARTUP_APPS:-xterm}
      SAFETY_CONFIRMATION: ${SAFETY_CONFIRMATION:-ask}
    ports:
      - "127.0.0.1:${DESKTOP_NOVNC_PORT:-6081}:6080"
    profiles: ["desktop"]
